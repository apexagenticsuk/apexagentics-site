<!doctype html>
<!-- Icon template: the Shift mark (bone + signal triangles, on-dark version) on an Ink tile. render.js screenshots it at 16, 32 and 180 px. ?s=size&r=1 rounds the corners. -->
<html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><style>
*{margin:0}html,body{background:transparent;overflow:hidden}
.i{width:var(--s);height:var(--s);background:#0B0D10;display:grid;place-items:center}
.i.r{border-radius:calc(var(--s)*.22)}
svg{display:block;width:calc(var(--s)*var(--k));height:calc(var(--s)*var(--k))}
</style></head><body><div class="i" id="i"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.50 -12.50 107.00 107.00"><path fill="#F2EFE9" d="M0.00 50.00L44.50 94.50L44.50 5.50Z"/><path fill="#7CFFB2" d="M100.00 32.00L55.50 -12.50L55.50 76.50Z"/></svg></div><script>
const q=new URLSearchParams(location.search),s=+q.get('s')||32,i=document.getElementById('i');
i.style.setProperty('--s',s+'px');i.style.setProperty('--k',s<=16?.94:s<=32?.84:.64);if(q.get('r'))i.classList.add('r');
</script></body></html>

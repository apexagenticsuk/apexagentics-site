<!doctype html>
<!-- Share image template (1200x630). ?b=uk (root, og.png): the UK option-1 lockup; ?b=web (/web/, og-web.png): the Shift option-1 lockup. Rendered by site/brand/render.js with Playwright so it uses the self-hosted fonts. -->
<html lang="en-GB"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><style>
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(../fonts/space-grotesk-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(../fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:500;src:url(../fonts/inter-tight-latin-500-normal.woff2) format('woff2')}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0B0D10;overflow:hidden}
.c{position:relative;width:1200px;height:630px;padding:84px 88px;color:#F2EFE9}
.orb{position:absolute;right:-90px;top:50%;width:640px;height:640px;margin-top:-320px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,255,178,.78),rgba(124,255,178,.38) 40%,rgba(124,255,178,.10) 68%,transparent)}
.glow{position:absolute;left:-200px;bottom:-260px;width:620px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,140,255,.12),transparent)}
.lock{position:absolute;left:88px;top:50%;width:900px;height:auto;transform:translateY(-62%)}
h1{position:relative;font-family:'Space Grotesk';font-weight:700;font-size:168px;line-height:.9;letter-spacing:-.05em}
h1 em{display:block;font-family:'Instrument Serif';font-style:italic;font-weight:400;letter-spacing:-.02em}
.u{position:absolute;left:88px;bottom:64px;font-family:'Inter Tight';font-weight:500;font-size:26px;color:#8A9099;letter-spacing:.01em}
.u b{color:#7CFFB2;font-weight:500}
.line{position:absolute;left:0;right:0;bottom:0;height:8px;background:#7CFFB2}
</style></head><body><div class="c"><div class="glow"></div><div class="orb"></div><img class="lock" id="lock" alt=""><p class="u" id="u"></p><div class="line"></div></div><script>
var b=new URLSearchParams(location.search).get('b')==='web'?'web':'uk',L=document.getElementById('lock');
L.src='../img/logo/apex-agentics-'+b+'-on-dark.svg';
document.getElementById('u').innerHTML='apexagentics<b>.co.uk'+(b==='web'?'/web':'')+'</b>';
</script></body></html>
